<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Meridian — AI Investment Research Desk</title>
<style>
  body { font-family: -apple-system, sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; background: #0f1117; color: #e4e6eb; }
  h1 { color: #4ade80; }
  input, button { font-size: 16px; padding: 10px; margin: 5px 0; }
  input[type=text] { width: 100%; box-sizing: border-box; background: #1a1d27; border: 1px solid #333; color: #fff; border-radius: 6px; }
  button { background: #4ade80; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; padding: 12px 24px; }
  button:disabled { background: #555; cursor: not-allowed; }
  .section { margin-top: 24px; padding: 16px; background: #1a1d27; border-radius: 8px; border-left: 4px solid #4ade80; }
  .section h2 { margin-top: 0; font-size: 16px; text-transform: uppercase; letter-spacing: 1px; color: #4ade80; }
  .bear { border-left-color: #f87171; }
  .bear h2 { color: #f87171; }
  .risk { border-left-color: #fbbf24; }
  .risk h2 { color: #fbbf24; }
  .verdict { border-left-color: #60a5fa; }
  .verdict h2 { color: #60a5fa; }
  #status { color: #999; margin-top: 10px; }
  pre { white-space: pre-wrap; font-family: inherit; line-height: 1.6; }
</style>
</head>
<body>
  <h1>📊 Meridian</h1>
  <p>AI-powered multi-agent investment research — Bull, Bear, Risk, and Portfolio Manager agents debate a real question using live SEC filings.</p>

  <input type="text" id="ticker" placeholder="Ticker (e.g. AAPL, MSFT, NVDA)" value="AAPL">
  <input type="text" id="query" placeholder="Your question (e.g. Should I be worried about competition?)">
  <button id="submitBtn" onclick="runAnalysis()">Run Analysis</button>
  <div id="status"></div>

  <div id="results"></div>

  <script>
    async function runAnalysis() {
      const ticker = document.getElementById('ticker').value.trim();
      const query = document.getElementById('query').value.trim();
      const btn = document.getElementById('submitBtn');
      const status = document.getElementById('status');
      const results = document.getElementById('results');

      if (!ticker || !query) {
        status.textContent = 'Please enter both a ticker and a question.';
        return;
      }

      btn.disabled = true;
      results.innerHTML = '';
      status.textContent = 'Running multi-agent research... this takes 20-40 seconds (several sequential AI calls).';

      try {
        const response = await fetch('https://automatic-space-meme-jjjj9pq6rg6p3ppj-8080.app.github.dev/analyze', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ ticker, query }),
        });

        if (!response.ok) {
          const err = await response.json();
          throw new Error(err.detail || 'Request failed');
        }

        const data = await response.json();
        status.textContent = '';

        results.innerHTML = `
          <div class="section"><h2>🐂 Bull Thesis</h2><pre>${escapeHtml(data.bull_thesis)}</pre></div>
          <div class="section bear"><h2>🐻 Bear Thesis</h2><pre>${escapeHtml(data.bear_thesis)}</pre></div>
          <div class="section risk"><h2>⚠️ Risk Assessment</h2><pre>${escapeHtml(data.risk_assessment)}</pre></div>
          <div class="section verdict"><h2>📋 Portfolio Manager's Verdict</h2><pre>${escapeHtml(data.final_verdict)}</pre></div>
        `;
      } catch (e) {
        status.textContent = 'Error: ' + e.message;
      } finally {
        btn.disabled = false;
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
  </script>
</body>
</html>
